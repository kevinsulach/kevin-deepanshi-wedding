<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#12271B" />
    <meta
      name="description"
      content="Kevin & Deepanshi are getting married at Majestic Crown, Delhi. You are cordially invited — open your royal envelope."
    />
    <meta property="og:title" content="Kevin & Deepanshi · A Royal Wedding" />
    <meta
      property="og:description"
      content="Together with their families, Kevin & Deepanshi request the honour of your presence. Majestic Crown, Delhi."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2312271B'/%3E%3Ccircle cx='32' cy='32' r='21' fill='none' stroke='%23D4AF37' stroke-width='1.6'/%3E%3Ccircle cx='32' cy='32' r='16.5' fill='none' stroke='%23D4AF37' stroke-width='0.8' opacity='0.6'/%3E%3Ctext x='32' y='39' font-family='Georgia,serif' font-size='17' font-style='italic' fill='%23D4AF37' text-anchor='middle'%3EK%C2%B7D%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Great+Vibes&family=Montserrat:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Kevin &amp; Deepanshi · A Royal Wedding Invitation</title>
    <style>
      /* Instant loading veil — visible before React mounts, replaced automatically */
      #invite-loader {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: radial-gradient(circle at 50% 38%, #1b3b2b 0%, #0b1710 72%);
        font-family: Georgia, "Times New Roman", serif;
      }
      #invite-loader .loader-ring {
        width: 74px;
        height: 74px;
        border: 1px solid rgba(212, 175, 55, 0.8);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #d4af37;
        font-style: italic;
        font-size: 22px;
        animation: loader-pulse 2.2s ease-in-out infinite;
      }
      #invite-loader .loader-text {
        color: #faf6f0;
        font-style: italic;
        font-size: 17px;
        letter-spacing: 0.04em;
        opacity: 0.9;
      }
      #invite-loader .loader-bar {
        width: 120px;
        height: 1px;
        background: rgba(212, 175, 55, 0.25);
        overflow: hidden;
        position: relative;
      }
      #invite-loader .loader-bar::after {
        content: "";
        position: absolute;
        top: 0;
        left: -40%;
        width: 40%;
        height: 100%;
        background: #d4af37;
        animation: loader-slide 1.6s ease-in-out infinite;
      }
      #invite-loader-note {
        max-width: 300px;
        margin: 0;
        padding: 0 24px;
        text-align: center;
        color: rgba(250, 246, 240, 0.78);
        font-style: italic;
        font-size: 14px;
        line-height: 1.7;
      }
      @keyframes loader-pulse {
        0%, 100% { transform: scale(1); opacity: 0.75; }
        50% { transform: scale(1.06); opacity: 1; }
      }
      @keyframes loader-slide {
        to { left: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="invite-loader">
        <div class="loader-ring">K·D</div>
        <div class="loader-text">Opening your invitation…</div>
        <div class="loader-bar"></div>
        <p id="invite-loader-note" hidden>
          Taking longer than usual… the invitation may still be publishing.
          Please refresh this page in a minute or two.
        </p>
      </div>
    </div>
    <script>
      // Safety net: if the app never starts (e.g. the site was not published
      // correctly yet), show a gentle note instead of a blank page forever.
      setTimeout(function () {
        var root = document.getElementById("root");
        var note = document.getElementById("invite-loader-note");
        if (root && !root.dataset.mounted && note) note.hidden = false;
      }, 12000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
